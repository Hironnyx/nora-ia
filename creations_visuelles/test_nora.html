<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Nora</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1f2833;
            border: 2px solid #00f0ff;
            border-radius: 16px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #00f0ff;
            border-bottom: 2px solid #ff007f;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            background: #ff007f;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .content { line-height: 1.6; font-size: 1.05rem; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Créé par l'Agent Designer</span>
        <h1>Test Nora</h1>
        <div class="content">
            <p>Bienvenue dans le monde de Nora</p>
        </div>
    </div>
</body>
</html>
